[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=78", "setuptools-scm"]

[project]
authors = [
  {name = "NCI GDC", email = "gdc_dev_questions-aaaaae2lhsbell56tlvh3upgoq@cdis.slack.com"}
]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = ["psqlgraph", "pyyaml"]
description = "Data models for gdcdictionary"
dynamic = ["version"]
keywords = ["python3", "gdcdatamodels", "gdcdictionary", "plaster"]
license-files = ["LICENSE"]
maintainers = [
  {name = "GDC Feature Team", email = "gdc_dev_questions-aaaaae2lhsbell56tlvh3upgoq@cdis.slack.com"}
]
name = "gdcdatamodel2"
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
changelog = ["towncrier"]
dev = ["coverage[toml]", "pytest", "pytest-cov", "testcontainers[postgresql]"]
docs = ["sphinx", "sphinx-rtd-theme", "sphinxcontrib-napoleon"]
lint = ["mypy", "pre-commit"]
validators = ["gdcdictionary"]
visualization = ["graphviz", "ipython"]

[project.scripts]
gdc_postgres_admin = "gdcdatamodel2.gdc_postgres_admin:main"

[project.urls]
Repository = "https://github.com/NCI-GDC/gdcdatamodel2"

[tool.coverage.html]
directory = "docs/htmlcov"
show_contexts = true
title = "gdcdatamodel2 coverage report"

[tool.coverage.run]
branch = true
context = "unit tests"
source = ["gdcdatamodel2"]

[tool.pytest.ini_options]
minversion = 6.0
# Silence warning by opting in to use pytest 6's new default value
addopts = "-rfE --color=yes --cov=gdcdatamodel2 --cov-report term"
console_output_style = "classic"
junit_family = "xunit2"
junit_logging = "system-out"
log_cli = "true"
log_cli_level = "INFO"
norecursedirs = [".git", ".tox", "dist", "build", "docs", "examples", "images"]
testpaths = ["tests/unit", "tests/integration"]

[tool.ruff]
exclude = ["examples", "src"]
line-length = 95
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
# see https://docs.astral.sh/ruff/rules/
ignore = [
  "E402",
  "E501",
  "E722",
  "E731",
  "F401",
  "F821",
  "RUF005",
  "RUF012",
  "RUF015",
  "N805"
]
select = [
  "E", # pydocstyle errors
  "F", # pyflakes
  "I", # isort
  "N", # pep8 naming
  "RUF", # ruff specific rules
  "UP", # pyupgrade
  "W" # pydocstyle warnings
]

[tool.ruff.lint.isort]
known-first-party = ["gdcdatamodel2", "tests"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.setuptools_scm]
fallback_version = "0.0.0"

[[tool.uv.index]]
name = "nexus"
url = "https://nexus.osdc.io/repository/pypi-all/simple"
