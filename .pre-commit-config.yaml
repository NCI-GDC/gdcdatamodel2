---
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.3.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.1.0 # last version to support py36
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: fix-encoding-pragma
        args: [--remove]
      - id: no-commit-to-branch
        args: [--branch, develop, --branch, master, --pattern, release/.*]
      - id: pretty-format-json
        args: [--autofix]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.1.15 # last version to support py36
    hooks:
      - id: forbid-crlf
      - id: forbid-tabs
        exclude: .(py|yaml|yml|tsv)$
      - id: remove-crlf
      - id: remove-tabs
        exclude: .(py|yaml|yml|tsv)$
  - repo: https://github.com/psf/black
    rev: 22.3.0
    hooks:
      - id: black
  - repo: https://github.com/pycqa/isort
    rev: 5.10.1
    hooks:
      - id: isort
        name: isort (python)
        args: [--profile, black]
      - id: isort
        name: isort (cython)
        types: [cython]
        args: [--profile, black]
      - id: isort
        name: isort (pyi)
        types: [pyi]
        args: [--profile, black]
  - repo: https://github.com/qiaouchicago/markdown-toc
    rev: 0.1.0
    hooks:
      - id: markdown-toc
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.14
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
        name: mdformat
        entry: mdformat
        types: [markdown]
        args: [--wrap, '88']
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.1.1
    hooks:
      - id: pydocstyle
        args: [convention=google, --add-ignore, 'D100,D101,D102,D103,D104,D105,D106,D107']
        additional_dependencies: [toml]
        exclude: ^(tests|unit_tests)/
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.1 # last version to support py36
    hooks:
      - id: bandit
        args: [--skip, 'B101,B303,B404,B603', --exclude, tests]
      # if a .bandit-baseline exists in repo
      # - id: bandit
      #   args: [--skip, "B101,B303,B404,B603", --exclude, tests, -b, .bandit-baseline]
  - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
    rev: 0.2.1
    hooks:
      - id: yamlfmt
        args: [--mapping, '2', --sequence, '4', --offset, '2', --width, '80']
  - repo: https://github.com/pappasam/toml-sort
    rev: v0.19.0 # last version to support py36
    hooks:
      - id: toml-sort
        args: [--in-place]
