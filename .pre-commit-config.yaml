---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
        exclude: .gitlab-ci.yml
      - id: end-of-file-fixer
        exclude: .(svg|ipynb)$
      - id: no-commit-to-branch
        args: [--branch, develop, --branch, master, --pattern, release/.*]
      - id: pretty-format-json
        args: [--autofix]
        exclude: examples/jupyter_example.ipynb
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: partial_dictionary/partial_dictionary.yml
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-crlf
      - id: forbid-tabs
        exclude: .(py|yaml|yml|tsv)$
      - id: remove-crlf
      - id: remove-tabs
        exclude: .(py|yaml|yml|tsv)$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/qiaouchicago/markdown-toc
    rev: 0.1.0
    hooks:
      - id: markdown-toc
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.3
    hooks:
      - id: bandit
        args: [--skip, 'B101,B105,B303,B404,B603', --exclude, tests]
  - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
    rev: 0.2.3
    hooks:
      - id: yamlfmt
        # preserve-quotes for partial_dictionary
        args: [--mapping, '2', --sequence, '4', --offset, '2', --width, '80', '--preserve-quotes']
  - repo: https://github.com/pappasam/toml-sort
    rev: v0.24.2
    hooks:
      - id: toml-sort
        args: [--in-place]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
