---
stages:
  - test
  - build
  - release

include:
  - project: nci-gdc/gitlab-templates
    ref: master
    file:
      - templates/global/full.yaml
      - templates/python/full.yaml

.prepareTox:
  script:
    - !reference [.load_github_key, script]
    - apt-get update && apt-get install -y gnupg
    - echo "deb http://apt.postgresql.org/pub/repos/apt/ focal-pgdg main 13" | tee
      /etc/apt/sources.list.d/pgdg.list
    - apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 7FCC7D46ACCC4CF8
    - apt-get update
    - apt-get install -y postgresql-client-13
    - psql -U postgres -h postgres -c "create user test with superuser password 'test';"
    - psql -U postgres -h postgres -c "create database gdcdatamodel2 with owner test;"
    - pip install "tox<4"
  needs: [pre-commit]

tox:
  stage: test
  parallel:
    matrix:
      - PY_VER: ['3.6', '3.7', '3.8', '3.9']
  image: ${BASE_CONTAINER_REGISTRY}/python${PY_VER}-builder
  services:
    - name: docker.osdc.io/ncigdc/ci-postgres-13:${BASE_CONTAINER_VERSION}
      alias: postgres
  tags:
    - dind
  variables:
    PG_HOST: postgres
    PG_PASS: test
    PG_USER: test
    PG_NAME: gdcdatamodel2
    PG_INDEXD_HOST: postgres
  before_script:
    - !reference [.prepareTox, script]
  needs:
    - !reference [.prepareTox, needs]
  script:
    - tox -r -e pytest
