---
language: python
dist: bionic

addons:
  postgresql: '13'
  apt:
    sources:
      - sourceline: deb http://apt.postgresql.org/pub/repos/apt/ bionic-pgdg main
          13
        key_url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    packages:
      - postgresql-13
      - postgresql-client-13

cache:
  - pip

jobs:
  fast_finish: true
  include:
    - name: pre-commit
      python:
        - 3.7
      stage: pre-commit
      cache:
        directories:
          - $HOME/.cache/pre-commit
      install:
        - pip install tox-travis
      script:
        - tox -e pre-commit
    - name: test
      python:
        - 3.6
        - 3.7
        - 3.8
        - 3.9
      before_install:
        # Copy custom configs from the repo because PG-13 isn't set up to run like
        # it normally does on Travis out of the box.
        - sudo cp travis/postgresql.conf /etc/postgresql/13/main/postgresql.conf
        - sudo cp travis/pg_hba.conf /etc/postgresql/13/main/pg_hba.conf
        - sudo pg_ctlcluster 13 main restart
      install:
        - pip install tox-travis
      before_script:
        - psql -U postgres -c "create user test with superuser password 'test';"
        - psql -U postgres -c "create database gdcdatamodel2 with owner test;"
      script:
        - tox
