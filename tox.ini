[tox]
minversion = 3.4.0
envlist = py36
isolated_build = True
skip_missing_interpreters = True

[pytest]
minversion = 6.0
addopts = -rflv
testpaths =
    tests/unit
    tests/integration

[testenv]
extras =
    dev
commands =
    python -m pytest --cov=gdcdatamodel2 --cov-report html --cov-report term

[testenv:docs]
commands =
    sphinx-build docs/source docs/build -b html

[testenv:release]
basepython = python3
deps =
    build
    twine
passenv =
    TWINE_PASSWORD
    TWINE_REPOSITORY
setenv =
    TWINE_USERNAME = {env:TWINE_USERNAME:__token__}
commands =
    python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
    python -m build
    python -m twine upload dist/*

[testenv:changelog]
basepython = python3
extras =
   changelog
commands =
   python3 bin/release changelog --no-draft
