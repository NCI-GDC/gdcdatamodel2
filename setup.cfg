[metadata]
name = gdcdatamodel2
description = Data models for gdcdictionary
long_description = file: README.md
long_description_content_type = text/markdown
author = NCI GDC
author_email = gdc_dev_questions-aaaaae2lhsbell56tlvh3upgoq@cdis.slack.com
license = Apache Software License 2.0
license_file = LICENSE
url = https://github.com/NCI-GDC/gdcdatamodel2
keywords = python3 gdcdatamodels gdcdictionary plaster
classifiers =
    Programming Language :: Python
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: PythonLicense :: OSI Approved :: Apache Software License
    Topic :: Software Development :: Libraries :: Python Modules

[options]
zip_safe = True
packages = find:
package_dir =
    =src
python_requires = >=3.7
include_package_data = True
install_requires =
    psqlgraph
    pyyaml


[options.packages.find]
where = src
exclude =
    tests*

[options.extras_require]
changelog =
    towncrier
dev =
    coverage[toml]
    pytest
    pytest-cov
    typing_extensions; python_version < "3.8"
docs =
    sphinx
    sphinx_rtd_theme
    sphinxcontrib-napoleon
lint =
    mypy
    pre-commit
validators =
    gdcdictionary @ git+https://github.com/NCI-GDC/gdcdictionary.git@inoue-follow_up-DICT-342#egg=gdcdictionary
visualization =
    graphviz ~= 0.19.1
    ipython ~= 7.16.3
