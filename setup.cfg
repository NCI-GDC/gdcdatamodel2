[metadata]
name = gdcdatamodel2
description = Data models for gdcdictionary
long_description = file: README.md
long_description_content_type = text/markdown
author = NCI GDC
author_email = gdc_dev_questions-aaaaae2lhsbell56tlvh3upgoq@cdis.slack.com
maintainer = GDC Feature Team
maintainer_email = gdc_dev_questions-aaaaae2lhsbell56tlvh3upgoq@cdis.slack.com
license = Apache Software License 2.0
license_files = LICENSE
url = https://github.com/NCI-GDC/gdcdatamodel2
keywords = python3 gdcdatamodels gdcdictionary plaster
classifiers =
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    License :: OSI Approved :: Apache Software License
    Topic :: Software Development :: Libraries :: Python Modules

[options]
zip_safe = True
packages = find:
package_dir =
    =src
python_requires = >=3.7
include_package_data = True
install_requires =
    psqlgraph
    pyyaml


[options.packages.find]
where = src
exclude =
    tests*

[options.extras_require]
changelog =
    towncrier
dev =
    attrs
    coverage[toml]
    pytest
    pytest-cov
    typing_extensions; python_version < "3.8"
docs =
    sphinx
    sphinx_rtd_theme
    sphinxcontrib-napoleon
lint =
    mypy
    pre-commit
validators =
    gdcdictionary
visualization =
    graphviz >= 0.19.1
    ipython >= 7.16.3

[options.entry_points]
console_scripts =
    gdc_postgres_admin = gdcdatamodel2.gdc_postgres_admin:main
